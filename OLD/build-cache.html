<!DOCTYPE html>
<html lang="he">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>YouTube Cache Builder</title>
<style>
body{font-family:Tahoma,Arial,sans-serif;background:#111;color:#eee;margin:0;padding:20px}
.wrap{max-width:900px;margin:0 auto}
.panel{background:#1d1d1d;border:1px solid #444;padding:16px;margin-bottom:16px}
button{background:#333;color:#fff;border:1px solid #666;padding:8px 12px;cursor:pointer;margin-right:8px}
button:disabled{opacity:.5;cursor:not-allowed}
#log{height:300px;overflow:auto;background:#000;padding:10px;font-family:monospace;white-space:pre-wrap}
.progress{height:14px;background:#333;position:relative;margin:12px 0}
.progress>div{height:100%;background:#2fa84f;width:0%}
.small{color:#bbb;font-size:13px;line-height:1.5}
.stat{display:inline-block;min-width:120px}
.warn{color:#ffcc66}
</style>
</head>
<body>
<div class="wrap">
  <div class="panel">
    <h1 style="margin-top:0">YouTube cache builder</h1>
    <div class="small">
      העמוד הזה פותר מראש video IDs ושומר אותם ב-localStorage.
      בסוף אפשר לייצא קובץ <b>youtube-cache.js</b> ולשים ליד index.html.
    </div>
    <div class="small warn" style="margin-top:8px">
      חשוב: לפתוח דרך <b>http://</b> או GitHub Pages, לא דרך file:// מקומי.
    </div>
    <div style="margin-top:12px">
      <button id="startBtn">Start / Resume</button>
      <button id="pauseBtn">Pause</button>
      <button id="exportBtn">Export youtube-cache.js</button>
      <button id="clearBtn">Clear saved cache</button>
    </div>
    <div class="progress"><div id="bar"></div></div>
    <div>
      <span class="stat" id="doneStat">0 scanned</span>
      <span class="stat" id="cachedStat">0 cached</span>
      <span class="stat" id="missStat">0 missed</span>
      <span class="stat" id="idxStat">0 / 0</span>
    </div>
  </div>
  <div class="panel"><div id="log"></div></div>
</div>

<script src="tracks-data.js"></script>
<script src="youtube-cache.js"></script>
<script>
(function(){
  const TRACKS = Array.isArray(window.LOCAL_TRACKS) ? window.LOCAL_TRACKS : [];
  const EXTERNAL = Object.assign({}, window.YT_TRACK_CACHE || {});
  const INSTANCES = [
    'https://yewtu.be',
    'https://vid.puffyan.us',
    'https://iv.melmac.space',
    'https://invidious.fdn.fr',
    'https://invidious.nerdvpn.de',
    'https://invidious.projectsegfau.lt'
  ];

  let running = false;
  let cache = loadCache();
  let misses = loadMisses();

  function loadCache(){
    try {
      return Object.assign({}, EXTERNAL, JSON.parse(localStorage.getItem('ytTrackCache') || '{}'));
    } catch (e) {
      return Object.assign({}, EXTERNAL);
    }
  }

  function loadMisses(){
    try {
      return JSON.parse(localStorage.getItem('ytTrackMisses') || '[]');
    } catch (e) {
      return [];
    }
  }

  function save(){
    localStorage.setItem('ytTrackCache', JSON.stringify(cache));
    localStorage.setItem('ytTrackMisses', JSON.stringify(misses));
  }

  function log(msg){
    const el = document.getElementById('log');
    el.textContent += msg + '\n';
    el.scrollTop = el.scrollHeight;
  }

  function qs(track){
    const artist = String(track.artist || '').split(',')[0].trim();
    return [
      `${track.name} ${track.artist} audio`,
      `${track.name} ${track.artist}`,
      `${track.name} ${artist}`
    ];
  }

  async function fetchJson(url){
    const r = await fetch(url);
    if(!r.ok) throw new Error('HTTP ' + r.status);
    return r.json();
  }

  async function resolveTrack(track){
    for (const q of qs(track)) {
      for (const base of INSTANCES) {
        try {
          const url = `${base}/api/v1/search?q=${encodeURIComponent(q)}&type=video&sort_by=relevance`;
          const items = await fetchJson(url);
          const hit = (Array.isArray(items) ? items : []).find(x => x && x.videoId);
          if (hit && hit.videoId) return hit.videoId;
        } catch (e) {}
      }
    }
    return '';
  }

  function updateUi(i){
    const total = TRACKS.length;
    const cachedCount = Object.keys(cache).length;
    document.getElementById('doneStat').textContent = (i || 0) + ' scanned';
    document.getElementById('cachedStat').textContent = cachedCount + ' cached';
    document.getElementById('missStat').textContent = misses.length + ' missed';
    document.getElementById('idxStat').textContent = (i || 0) + ' / ' + total;
    document.getElementById('bar').style.width = ((i || 0) / Math.max(1, total) * 100) + '%';
  }

  async function run(){
    if (location.protocol === 'file:') {
      log('Blocked: open this page from GitHub Pages or a local server, not file://');
      return;
    }

    running = true;
    const total = TRACKS.length;
    log(`Starting. ${total} tracks loaded.`);

    for (let i = 0; i < total && running; i++) {
      const t = TRACKS[i];
      updateUi(i);

      if (!t || !t.uri) continue;
      if (cache[t.uri] || misses.includes(t.uri)) continue;

      log(`Resolving ${i + 1}/${total}: ${t.name} — ${t.artist}`);
      const id = await resolveTrack(t);

      if (id) {
        cache[t.uri] = id;
        log('  ✓ ' + id);
      } else {
        misses.push(t.uri);
        log('  ✗ no result');
      }

      save();
      await new Promise(r => setTimeout(r, 250));
    }

    updateUi(total);
    running = false;
    log('Done.');
  }

  function exportJs(){
    const content = 'window.YT_TRACK_CACHE = ' + JSON.stringify(cache, null, 2) + ';\n';
    const blob = new Blob([content], {type:'text/javascript;charset=utf-8'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'youtube-cache.js';
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  }

  document.getElementById('startBtn').onclick = () => {
    if (!running) run();
  };
  document.getElementById('pauseBtn').onclick = () => {
    running = false;
    log('Paused.');
  };
  document.getElementById('exportBtn').onclick = exportJs;
  document.getElementById('clearBtn').onclick = () => {
    if (!confirm('למחוק cache שמור?')) return;
    localStorage.removeItem('ytTrackCache');
    localStorage.removeItem('ytTrackMisses');
    cache = Object.assign({}, EXTERNAL);
    misses = [];
    document.getElementById('log').textContent = '';
    updateUi(0);
    log('Cleared.');
  };

  updateUi(0);
  log(`Ready. ${TRACKS.length} tracks detected.`);
})();
</script>
</body>
</html>
